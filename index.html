<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENERATOR PREDIKSI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0a; --surface:#111111; --surface2:#1a1a1a;
    --border:#2a2a2a; --border-bright:#3a3a3a;
    --text:#e8e8e8; --text-muted:#666; --text-dim:#444;
    --accent:#00ff88; --accent-dim:rgba(0,255,136,0.10);
    --gold:#f0b429; --gold-dim:rgba(240,180,41,0.10);
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--sans); background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5; }
  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; }
  .wrap, header { position:relative; z-index:1; }
  #matrixCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.18; pointer-events:none; }
  header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:0 28px; height:54px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:100;
  }
  .logo { font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:0.18em; color:var(--accent); text-transform:uppercase; }
  .header-right { display:flex; align-items:center; gap:14px; }
  .status-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px rgba(0,255,136,0.4); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .ver-badge { font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:0.15em; color:var(--text-dim); border:1px solid var(--border-bright); padding:3px 8px; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 20px; display:flex; flex-direction:column; gap:14px; }
  .panel { background:var(--surface); border:1px solid var(--border); }
  .panel-header { padding:9px 16px; background:var(--surface2); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .panel-label { font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:0.22em; color:var(--text-muted); text-transform:uppercase; }
  .panel-label.gold { color:var(--gold); }
  .panel-body { padding:14px 16px; }
  .selector-grid { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  select, input[type="text"] {
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    font-family:var(--mono); font-size:11px; padding:7px 10px; outline:none;
    -webkit-appearance:none; transition:border-color 0.15s; cursor:pointer; height:34px;
  }
  select:focus, input[type="text"]:focus { border-color:var(--accent); }
  input[type="text"]::placeholder { color:var(--text-dim); }
  .input-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .input-main { font-family:var(--mono); font-size:20px; font-weight:700; width:110px; letter-spacing:0.2em; height:44px; padding:0 12px; text-align:center; }
  .btn { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; border:1px solid var(--border); background:var(--surface2); color:var(--text-muted); padding:0 16px; cursor:pointer; transition:all 0.12s; height:34px; display:inline-flex; align-items:center; white-space:nowrap; }
  .btn:hover { border-color:var(--border-bright); color:var(--text); }
  .btn-accent { background:var(--accent); border-color:var(--accent); color:#000; height:44px; padding:0 22px; font-size:11px; }
  .btn-accent:hover { background:#00cc6a; border-color:#00cc6a; }
  .btn-accent:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-ghost { background:transparent; }
  .btn-gold { background:var(--gold); border-color:var(--gold); color:#000; }
  .btn-gold:hover { background:#d4a017; border-color:#d4a017; color:#000; }
  .output-box {
    background:var(--bg); border:1px solid var(--border); font-family:var(--mono);
    font-size:11.5px; line-height:2; padding:18px; min-height:220px;
    color:var(--text); white-space:pre-wrap; letter-spacing:0.03em;
  }
  .output-actions { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--border); background:var(--surface2); }
  #toast { position:fixed; bottom:24px; right:24px; background:var(--accent); color:#000; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.1em; padding:10px 20px; text-transform:uppercase; transform:translateY(80px); opacity:0; transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1); z-index:9999; pointer-events:none; }
  #toast.show { transform:translateY(0); opacity:1; }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border-bright); }
 .logo-select-wrap { position:relative; display:inline-block; }
  .logo-selected {
    display:inline-flex; align-items:center;
    background:var(--surface2); border:1px solid var(--border);
    padding:6px 24px 6px 12px;
    cursor:pointer; height:34px; width:auto; min-width:120px;
    transition:border-color 0.15s; user-select:none; position:relative;
  }
  .logo-selected:hover { border-color:var(--border-bright); }
  .logo-selected.open { border-color:var(--accent); }
  .logo-selected::after { content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--text-muted); }
  .logo-selected img, .logo-option img { display:none !important; }
  #logoSelectedLabel {
    display:inline-block !important;
    font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase;
  }
  .logo-dropdown {
    position:absolute; top:calc(100% + 2px); left:0; z-index:1000;
    background:var(--surface); border:1px solid var(--border);
    min-width:120px; width:100%; display:none; flex-direction:column;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .logo-dropdown.open { display:flex; }
  .logo-option {
    display:flex; align-items:center; justify-content:flex-start;
    padding:8px 12px; cursor:pointer;
    transition:background 0.1s; border-bottom:1px solid var(--border);
    white-space:nowrap;
    font-family:var(--mono); font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;
  }
  .logo-option:last-child { border-bottom:none; }
  .logo-option:hover { background:var(--surface2); color:var(--text); }
  .logo-option.active { background:var(--accent-dim); color:var(--accent); }
</style>

      <button class="btn btn-gold" id="btnDownload" style="height:34px;padding:0 14px;font-size:10px;display:none;" onclick="doDownloadImage()">⬇ Download Gambar</button>
    </div>

<script>
// ============================================================
// SHIO
// ============================================================
const SHIO = {
  KUDA:    ["01","13","25","37","49","61","73","85","97"],
  ULAR:    ["02","14","26","38","50","62","74","86","98"],
  NAGA:    ["03","15","27","39","51","63","75","87","99"],
  KELINCI: ["04","16","28","40","52","64","76","88","00"],
  HARIMAU: ["05","17","29","41","53","65","77","89"],
  KERBAU:  ["06","18","30","42","54","66","78","90"],
  TIKUS:   ["07","19","31","43","55","67","79","91"],
  BABI:    ["08","20","32","44","56","68","80","92"],
  ANJING:  ["09","21","33","45","57","69","81","93"],
  AYAM:    ["10","22","34","46","58","70","82","94"],
  MONYET:  ["11","23","35","47","59","71","83","95"],
  KAMBING: ["12","24","36","48","60","72","84","96"]
};
function toShio(pair) {
  const p = String(pair).padStart(2,"0");
  for (const [k,v] of Object.entries(SHIO)) if (v.includes(p)) return k;
  return "?";
}

// ============================================================
// HELPERS (ORIGINAL - UNCHANGED)
// ============================================================
function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function hasAscPair(s) {
  for (let i = 0; i < s.length-1; i++)
    if (parseInt(s[i+1]) === parseInt(s[i])+1) return true;
  return false;
}

function gapOK(prev, next) {
  for (let p = 0; p < prev.length; p++) {
    const d = prev[p];
    for (let np = 0; np < next.length; np++) {
      if (next[np] === d && Math.abs(np-p) <= 1) return false;
    }
  }
  return true;
}

function junctionAscOK(prev, next) {
  return parseInt(next[0]) !== parseInt(prev[prev.length-1])+1;
}

function extractPairs(s) {
  const pairs = [];
  for (let i = 0; i < s.length-1; i++) pairs.push(s[i]+s[i+1]);
  return pairs;
}

function registerPairs(s, set) { extractPairs(s).forEach(p => set.add(p)); }
function unregisterPairs(s, set) { extractPairs(s).forEach(p => set.delete(p)); }

function newPairsConflict(c, usedPairs) {
  return extractPairs(c).some(p => usedPairs.has(p));
}

function canAppend(prev, c, usedPairs) {
  if (prev) {
    if (!gapOK(prev, c)) return false;
    if (!junctionAscOK(prev, c)) return false;
  }
  if (newPairsConflict(c, usedPairs)) return false;
  return true;
}

function isValidNum(s) {
  if (new Set(s).size !== s.length) return false;
  if (hasAscPair(s)) return false;
  return true;
}

function checkGlobalPositionRules(candidate, existingList, digitLength) {
  const candPairs = getPairPositions(candidate);
  const tempList = [...existingList, candidate];
  const duplicatePairsRegistry = new Set();

  for (let i = 0; i < tempList.length; i++) {
    const p1 = getPairPositions(tempList[i]);
    for (let j = i + 1; j < tempList.length; j++) {
      const p2 = getPairPositions(tempList[j]);
      for (const item1 of p1) {
        for (const item2 of p2) {
          if (item1.pair === item2.pair && item1.posIdx === item2.posIdx) {
            // Jika tipe digit 3D atau 2D, kembar posisi langsung AUTO-REJECT
            if (digitLength === 3 || digitLength === 2) {
              return false;
            }
            // Jika 4D, kumpulkan untuk dicek batas maksimalnya nanti
            if (digitLength === 4) {
              duplicatePairsRegistry.add(item1.pair);
            }
          }
        }
      }
    }
  }

  // Khusus 4D: maksimal hanya boleh ada 2 jenis pair unik yang kembar posisi
  if (digitLength === 4 && duplicatePairsRegistry.size > 2) {
    return false;
  }
  return true;
}

function genAllValid(pool, len) {
  const results = [];
  function perm(cur, rem) {
    if (cur.length === len) {
      const s = cur.join('');
      if (isValidNum(s)) results.push(s);
      return;
    }
    for (const d of rem) {
      if (cur.length > 0 && parseInt(d) === parseInt(cur[cur.length-1])+1) continue;
      perm([...cur, d], rem.filter(x => x !== d));
    }
  }
  perm([], pool);
  return shuffle(results);
}

// ============================================================
// ORIGINAL buildList (used for 6D mode: 4D, 3D, 2D)
// ============================================================
function buildList(candidates, count, digitLength) {
  const result = [];
  const usedNums = new Set();
  const usedPairs = new Set();
  let attempts = 0;

  function bt() {
    if (result.length === count) return true;
    const prev = result.length > 0 ? result[result.length-1] : null;
    for (const c of candidates) {
      if (usedNums.has(c)) continue;
      if (!canAppend(prev, c, usedPairs)) continue;
      // Validasi tambahan untuk memblokir kembar posisi pada 3D dan 2D
      if (!checkGlobalPositionRules(c, result, digitLength)) continue;
      
      result.push(c); usedNums.add(c); registerPairs(c, usedPairs);
      if (bt()) return true;
      result.pop(); usedNums.delete(c); unregisterPairs(c, usedPairs);
      if (++attempts > 15000) return false;
    }
    return false;
  }

  for (let attempt = 0; attempt < 50; attempt++) {
    result.length = 0; usedNums.clear(); usedPairs.clear(); attempts = 0;
    shuffle(candidates);
    if (bt()) return result;
  }
  return result;
}

// ============================================================
// NEW buildList4D_5digit — Rule 6 Modified for 5D mode TOP 4D
// ============================================================
// RULE BARU:
// - Setiap pair 2-digit (posisi 0-1, 1-2, 2-3) di angka 4D boleh muncul di MAX 2 angka.
// - Jika pair sama di 2 angka, salah satu HARUS di posisi MID (pos 1-2),
//   dan satunya di posisi FRONT (pos 0-1) atau BACK (pos 2-3).
// - TIDAK BOLEH: pair sama di posisi yang sama di 2 angka.
// - TIDAK BOLEH: pair sama di FRONT satu angka dan BACK angka lain.
// - Harus ada gap minimal 1 angka (1 baris) antara kedua angka yang share pair.
// - Digit dari banned set (result kemarin) TIDAK BOLEH muncul di output.
// ============================================================
function getPairPositions(num) {
  const res = [];
  for (let i = 0; i < num.length - 1; i++) {
    res.push({ pair: num[i] + num[i+1], posIdx: i });
  }
  return res;
}

function isValid4DNewRule(candidate, existingList) {
  // Ambil posisi pair kandidat saat ini
  const cPairs = [
    { pair: candidate[0] + candidate[1], pos: 'FRONT' },
    { pair: candidate[1] + candidate[2], pos: 'MID' },
    { pair: candidate[2] + candidate[3], pos: 'BACK' }
  ];

  for (const cItem of cPairs) {
    for (let i = 0; i < existingList.length; i++) {
      const ex = existingList[i];
      const exPairs = [
        { pair: ex[0] + ex[1], pos: 'FRONT' },
        { pair: ex[1] + ex[2], pos: 'MID' },
        { pair: ex[2] + ex[3], pos: 'BACK' }
      ];

      for (const exItem of exPairs) {
        if (cItem.pair === exItem.pair) {
          // 1. TIDAK BOLEH: pair sama di posisi yang sama
          if (cItem.pos === exItem.pos) return false;

          // 2. TIDAK BOLEH: pair sama di FRONT satu angka dan BACK di angka lain
          if ((cItem.pos === 'FRONT' && exItem.pos === 'BACK') || (cItem.pos === 'BACK' && exItem.pos === 'FRONT')) {
            return false;
          }

          // 3. WAJIB: Salah satu harus di posisi MID, dan satunya di FRONT atau BACK
          const validCombo = (cItem.pos === 'MID' && (exItem.pos === 'FRONT' || exItem.pos === 'BACK')) ||
                             (exItem.pos === 'MID' && (cItem.pos === 'FRONT' || cItem.pos === 'BACK'));
          if (!validCombo) return false;

          // 4. WAJIB: Harus ada gap minimal 1 baris (selisih index minimal 2)
          const gap = existingList.length - i;
          if (gap < 2) return false;
        }
      }
    }
  }
  return true;
}

function buildList4D_5digit(pool, bannedSet, count) {
  // Generate 4D list untuk 5D mode dengan rule baru
  // Banned check: tidak boleh ada digit dari bannedSet
  const result = [];
  const usedNums = new Set();
  let attempts = 0;
  const maxAttempts = 200000;

// Generate semua kandidat 4D valid (Steril hanya dari pool angka main 5D)
  const allCandidates = [];
  function perm(cur, rem) {
    if (cur.length === 4) {
      const s = cur.join('');
      if (isValidNum(s)) allCandidates.push(s);
      return;
    }
    for (const d of rem) {
      if (cur.length > 0 && parseInt(d) === parseInt(cur[cur.length-1])+1) continue;
      perm([...cur, d], rem.filter(x => x !== d));
    }
  }
  // Kunci parameter awal perm langsung menggunakan array pool yang sudah bersih
  perm([], [...pool]);
  const candidates = shuffle(allCandidates);
  // Backtracking dengan rule baru
  function bt() {
    if (result.length === count) return true;
    for (const c of candidates) {
      if (usedNums.has(c)) continue;
      if (!isValid4DNewRule(c, result)) continue;
      result.push(c);
      usedNums.add(c);
      if (bt()) return true;
      result.pop();
      usedNums.delete(c);
      if (++attempts > maxAttempts) return false;
    }
    return false;
  }

for (let attempt = 0; attempt < 50; attempt++) {
    result.length = 0;
    usedNums.clear();
    attempts = 0;
    shuffle(candidates);
    if (bt()) return result;
  }
  
// ============================================================
  // AMAN: Jika aturan terlalu ketat & stuck, isi kekurangan baris dengan kandidat steril sisa
  // ============================================================
  if (result.length < count) {
    for (const c of candidates) {
      if (result.length === count) break;
      if (!result.includes(c)) {
        result.push(c);
      }
    }
  }

  // JIKA MASIH KURANG, JANGAN PERNAH AMBIL DARI LUAR POOL! 
  // Paksa loop generator murni dari sisa kombinasi pool bbfs tanpa filter ketat posisi
  if (result.length < count) {
    for (const c of shuffle(candidates)) {
      if (result.length === count) break;
      if (!result.includes(c)) {
        result.push(c);
      }
    }
  }
  return result;
}

// ============================================================
// ORIGINAL build2DGrid (unchanged)
// ============================================================
function build2DGrid(candidates) {
  for (let attempt = 0; attempt < 100; attempt++) {
    const pool = shuffle([...candidates]);
    const usedNums = new Set();
    const usedPairs = new Set();

    const row1 = [];
    function fillRow1() {
      if (row1.length === 6) return true;
      const prev = row1.length > 0 ? row1[row1.length-1] : null;
      for (const c of pool) {
        if (usedNums.has(c)) continue;
        if (!canAppend(prev, c, usedPairs)) continue;
        // Cek anti kembar posisi secara global untuk baris 1
        if (!checkGlobalPositionRules(c, row1, 2)) continue;
        
        row1.push(c); usedNums.add(c); registerPairs(c, usedPairs);
        if (fillRow1()) return true;
        row1.pop(); usedNums.delete(c); unregisterPairs(c, usedPairs);
      }
      return false;
    }
    if (!fillRow1()) continue;

    const row2 = [];
    function fillRow2() {
      if (row2.length === 6) return true;
      const col = row2.length;
      const prev = row2.length > 0 ? row2[row2.length-1] : null;
      for (const c of pool) {
        if (usedNums.has(c)) continue;
        if (!canAppend(prev, c, usedPairs)) continue;
        
        let vertOK = true;
        for (let dc = -1; dc <= 1; dc++) {
          const rc = col+dc;
          if (rc >= 0 && rc < 6) {
            if (!gapOK(row1[rc], c)) { vertOK = false; break; }
            if (dc === 0 && !junctionAscOK(row1[rc], c)) { vertOK = false; break; }
          }
        }
        if (!vertOK) continue;
        
        // Cek anti kembar posisi secara global (digabungkan dengan row1 yang sudah jadi)
        if (!checkGlobalPositionRules(c, [...row1, ...row2], 2)) continue;
        
        row2.push(c); usedNums.add(c); registerPairs(c, usedPairs);
        if (fillRow2()) return true;
        row2.pop(); usedNums.delete(c); unregisterPairs(c, usedPairs);
      }
      return false;
    }
    if (fillRow2()) return [...row1, ...row2];
  }
  return shuffle([...candidates]).slice(0, 12);
}

function shuffleNoAsc(arr) {
  let result = shuffle([...arr]);
  for (let t = 0; t < 10000; t++) {
    if (!hasAscPair(result.join(''))) break;
    result = shuffle([...arr]);
  }
  return result;
}

const KOITOTO_NAME = {
  "CAMBODIA": "CAMBODIA", "BULLSEYE": "BULLSEYE", "SYDNEY": "SYDNEY",
  "CHINA": "CHINA", "JEPANG": "JEPANG", "SINGAPORE": "SINGAPORE",
  "MONGOLIA": "MONGOLIA", "PCSO": "PCSO", "TAIWAN": "TAIWAN",
  "HONGKONG": "HONGKONG",
  "TOTO MACAU P1": "TOTO MACAU P1", "TOTO MACAU P2": "TOTO MACAU P2",
  "TOTO MACAU P3": "TOTO MACAU P3", "TOTO MACAU P4": "TOTO MACAU P4",
  "TOTO MACAU P5": "TOTO MACAU P5", "TOTO MACAU P6": "TOTO MACAU P6",
  "KINGKONG P1": "KINGKONG P1", "KINGKONG P2": "KINGKONG P2"
};

// ============================================================
// MAIN BUILD
// ============================================================
function build(mainInput) {
  if (!/^\d{4}$/.test(mainInput)) return { error: "Input harus 4 digit angka." };
  const bannedSet = new Set(mainInput.split(''));
  const remaining = [...'0123456789'].filter(d => !bannedSet.has(d));
  if (remaining.length < 6) return { error: "Digit tersisa kurang dari 6." };
  const pool = shuffle(remaining).slice(0, 6);

  const cands4D = genAllValid(pool, 4);
  const cands3D = genAllValid(pool, 3);
  const cands2D = genAllValid(pool, 2);

// 6D MODE: Diperbarui dengan parameter digitLength
  const fourD  = buildList(cands4D, 4, 4);   // 4D Mode 6D (Lolos aturan kembar posisi khusus 4D)
  const threeD = buildList(cands3D, 6, 3);   // 3D Mode 6D (Anti kembar posisi)
  const twoD   = build2DGrid(cands2D);       // 2D Grid Mode 6D (Menggunakan grid khusus bawaan)
  const twoD1  = twoD.slice(0, 6);
  const twoD2  = twoD.slice(6, 12);

// ============================================================
  // STERILISASI MODE 5D: Pilih 5 digit murni dari 6 angka sisa untuk Angka Main
  // ============================================================
  let angkaMain5 = shuffle([...pool]).slice(0, 5);
  for (let t = 0; t < 10000; t++) {
    if (!hasAscPair(angkaMain5.join(''))) break;
    angkaMain5 = shuffle([...pool]).slice(0, 5);
  }

  // Paksa generator 4D, 3D, dan 2D di Mode 5D HANYA BOLEH membaca dari angkaMain5!
  const fourD_k  = buildList4D_5digit(angkaMain5, bannedSet, 6); 
  const threeD_k = buildList(genAllValid(angkaMain5, 3), 7, 3);   
  const twoD_k   = buildList(genAllValid(angkaMain5, 2), 9, 2);   

  const bbfsDigits = shuffleNoAsc([...pool]);
  const bbfs = `✹ ${bbfsDigits.join(' ')} ✹`;

  let cb1 = angkaMain5[4], cb2 = angkaMain5[3];
  if (parseInt(cb2) === parseInt(cb1) + 1) { cb1 = angkaMain5[3]; cb2 = angkaMain5[4]; }
  const colokBebas = `${cb1} / ${cb2}`;

  let p1a = angkaMain5[0], p1b = angkaMain5[3];
  let p2a = angkaMain5[1], p2b = angkaMain5[2];
  if (parseInt(p1b) === parseInt(p1a) + 1) [p1a, p1b] = [p1b, p1a];
  if (parseInt(p2b) === parseInt(p2a) + 1) [p2a, p2b] = [p2b, p2a];
  const colok2D = `${p1a}${p1b} / ${p2a}${p2b}`;

  const cb2_pairs = [
    bbfsDigits[0]+bbfsDigits[1],
    bbfsDigits[2]+bbfsDigits[3],
    bbfsDigits[4]+bbfsDigits[5],
  ];
  const cb   = cb2_pairs.map(p => p[0]);
  const twin = cb.map(c => c+c);

  const sh1 = toShio(bbfsDigits[0]+bbfsDigits[1]);
  const sh2 = toShio(bbfsDigits[3]+bbfsDigits[4]);
  const shioJitu = toShio(angkaMain5[3]+angkaMain5[4]);

  const G = id => document.getElementById(id).value;
  const predName = G('prediksiName');
  const dayName  = G('dayName');
  const day      = G('day');
  const month    = G('month');
  const monthUP  = month.toUpperCase();
  const year     = G('year');
  const kName    = KOITOTO_NAME[predName] || predName;

  function make6D(siteName) {
    let out = `PREDIKSI ${kName} ${siteName.toUpperCase()} ${day} ${monthUP} ${year}\n\n`;
    out += `BBFS   : ${bbfs}\n\n`;
    out += `4D     : ✹ ${fourD.join(' - ')} ✹\n\n`;
    out += `3D     : ✹ ${threeD.join(' - ')} ✹\n\n`;
    out += `⇓ ANGKA TOP 2D 12 LINE (BB) ⇓\n\n`;
    out += `✪ ${twoD1.join(' - ')} ✪\n\n`;
    out += `✪ ${twoD2.join(' - ')} ✪\n\n`;
    out += `CB 2D  : ✪ ${cb2_pairs.join(' - ')} ✪\n\n`;
    out += `CB     : ✹ ${cb.join(' - ')} ✹\n\n`;
    out += `TWIN   : ✪ ${twin.join(' - ')} ✪\n\n`;
    out += `Shio   : ✪ ${sh1} - ${sh2} ✪\n\n`;
    out += `Selalu Utamakan Prediksi Sendiri (UPS)`;
    return out;
  }

  function make5D(siteName) {
    let out = `PREDIKSI ${kName} ${siteName.toUpperCase()} ${day} ${monthUP} ${year}\n\n`;
    out += `ANGKA MAIN  : ✹ ${angkaMain5.join('')} ✹\n\n`;
    out += `TOP 4D (BB) : ✹ ${fourD_k.join(' - ')} ✹\n`;
    out += `TOP 3D (BB) : ✹ ${threeD_k.join(' - ')} ✹\n`;
    out += `TOP 2D (BB) : ✹ ${twoD_k.join(' - ')} ✹\n\n`;
    out += `COLOK BEBAS : ✹ ${colokBebas} ✹\n`;
    out += `COLOK 2D    : ✹ ${colok2D} ✹\n\n`;
    out += `SHIO JITU   : ${shioJitu}\n\n`;
    out += `Tetap Utamakan Prediksi Sendiri (UPS)`;
    return out;
  }

  return {
    nustoto:  make6D('Nustoto'),
    kikototo: make6D('Kikototo'),
    keytoto:  make6D('Keytoto'),
    koitoto:  make5D('Koitoto'),
    omacuan:  make5D('Omacuan'),
    wopslot:  make5D('Wopslot'),
  };
}

// ============================================================
// UI (ORIGINAL - UNCHANGED)
// ============================================================
let lastResult = null;

const LOGOS = {
  koitoto: "KOITOTO",
  kikototo: "KIKOTOTO",
  keytoto: "KEYTOTO",
  nustoto: "NUSTOTO",
  omacuan: "OMACUAN",
  wopslot: "WOPSLOT"
};

const PLATFORM_OPTIONS = {
  '6': [
    { value:'nustoto',  label:'Nustoto' },
    { value:'kikototo', label:'Kikototo' },
    { value:'keytoto',  label:'Keytoto' },
  ],
  '5': [
    { value:'koitoto',  label:'Koitoto' },
    { value:'omacuan',  label:'Omacuan' },
    { value:'wopslot',  label:'Wopslot' }
  ]
};;

let currentMode = null;

function buildLogoDropdown(digit) {
  const dropdown = document.getElementById('logoDropdown');
  const opts = PLATFORM_OPTIONS[digit] || [];
  dropdown.innerHTML = '';
  opts.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'logo-option';
    div.dataset.value = opt.value;
    div.textContent = LOGOS[opt.value] || opt.label;
    div.addEventListener('click', function() { selectLogoOption(opt.value, opt.label); });
    dropdown.appendChild(div);
  });
}

function selectLogoOption(value, label) {
  currentMode = value;
  const labelEl = document.getElementById('logoSelectedLabel');
  labelEl.textContent = LOGOS[value] || label;
  labelEl.style.display = 'inline-block';
  document.getElementById('logoSelectedImg').style.display = 'none';
  document.getElementById('logoDropdown').classList.remove('open');
  document.getElementById('logoSelected').classList.remove('open');
  document.querySelectorAll('.logo-option').forEach(el => {
    el.classList.toggle('active', el.dataset.value === value);
  });
  if (lastResult) applyOutput(lastResult);
}

function toggleLogoDropdown() {
  document.getElementById('logoDropdown').classList.toggle('open');
  document.getElementById('logoSelected').classList.toggle('open');
}

document.addEventListener('click', function(e) {
  const wrap = document.getElementById('logoSelectWrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('logoDropdown').classList.remove('open');
    document.getElementById('logoSelected').classList.remove('open');
  }
});

function onDigitModeChange() {
  const digit = document.getElementById("digitMode").value;
  const wrap = document.getElementById('logoSelectWrap');
  currentMode = null;
  if (!digit) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'inline-block';
  buildLogoDropdown(digit);
  const opts = PLATFORM_OPTIONS[digit] || [];
  if (opts.length > 0) selectLogoOption(opts[0].value, opts[0].label);
}

function applyOutput(result) {
  // Jika mode belum dipilih, otomatis arahkan ke pilihan pertama mode digit yang aktif
  if (!currentMode) {
    const digit = document.getElementById("digitMode").value;
    const opts = PLATFORM_OPTIONS[digit] || [];
    if (opts.length > 0) {
      currentMode = opts[0].value;
    } else {
      document.getElementById("outputBox").textContent = "Pilih Mode Output (6 Digit / 5 Digit) terlebih dahulu.";
      document.getElementById("outputPanelLabel").textContent = "Nustoto";
      return;
    }
  }
  const mode = currentMode;
  const labels = { nustoto:'Nustoto', kikototo:'Kikototo', keytoto:'Keytoto', koitoto:'Koitoto', omacuan:'Omacuan', wopslot:'Wopslot' };
  const is5D = (mode === 'koitoto' || mode === 'omacuan' || mode === 'wopslot');
  document.getElementById("outputBox").textContent = result[mode] || '';
  document.getElementById("outputPanelLabel").textContent = labels[mode] || mode;
  document.getElementById("btnCopy").className = is5D ? "btn btn-gold" : "btn btn-accent";
  document.getElementById("btnCopy").style.cssText = "height:34px;padding:0 14px;font-size:10px;";
}

function doGenerate() {
  const v = document.getElementById("mainInput").value.trim();
  const btn = document.getElementById("btnGenerate");
  btn.disabled = true;
  btn.textContent = "Loading...";
  setTimeout(() => {
    const result = build(v);
    btn.disabled = false;
    btn.textContent = "Generate";
    if (result.error) { showToast(result.error); return; }
    lastResult = result;
    applyOutput(result);
  }, 20);
}

function doClear() {
  document.getElementById("mainInput").value = "";
  document.getElementById("outputBox").textContent = "Belum ada data.";
  lastResult = null;
}

function doCopy(id) {
  const text = document.getElementById(id).textContent;
  if (!text || text === "Belum ada data.") return;
  navigator.clipboard.writeText(text).then(() => showToast("Disalin!"));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

document.addEventListener('DOMContentLoaded', () => {
  const ds = document.getElementById('day');
  const today = new Date().getDate().toString().padStart(2,'0');
  for (let i = 1; i <= 31; i++) {
    const val = i.toString().padStart(2,'0');
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    if (val === today) opt.selected = true;
    ds.appendChild(opt);
  }
  const monthMap = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const monthSel = document.getElementById('month');
  const curMonth = monthMap[new Date().getMonth()];
  for (const opt of monthSel.options) {
    if (opt.value === curMonth) { opt.selected = true; break; }
  }
});

// ============================================================
// MATRIX RAIN (ORIGINAL - UNCHANGED)
// ============================================================
(function() {
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&';
  const fontSize = 14;
  let cols, drops;
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / fontSize);
    drops = Array(cols).fill(1);
  }
  function draw() {
    ctx.fillStyle = 'rgba(10,10,10,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = drops[i] * fontSize < canvas.height * 0.1 ? '#ffffff' : '#00ff88';
      ctx.font = fontSize + 'px "IBM Plex Mono", monospace';
      ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  window.addEventListener('resize', resize);
  resize();
  setInterval(draw, 45);
})();

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'mainInput') doGenerate();
});
